# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
builds:
  - skip: true
checksum:
  name_template: "{{ .ProjectName }}_sha256_checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: ./release/packages/*
release:
  github:
    owner: thekhanj
    name: salsa

  draft: false

  extra_files:
    - glob: ./release/packages/*
